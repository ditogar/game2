name: Capture private Godot game

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout capture harness
        uses: actions/checkout@v4

      - name: Download and verify Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            --output godot.zip
          echo "4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9  godot.zip" | sha512sum --check --strict
          unzip -q godot.zip
          mkdir -p runtime
          mv Godot_v4.7.1-stable_linux.x86_64 runtime/godot
          chmod +x runtime/godot
          runtime/godot --version

      - name: Checkout private game
        uses: actions/checkout@v4
        with:
          repository: ditogar/pokemon
          ref: main
          path: private-game
          token: ${{ github.token }}
          fetch-depth: 1
          lfs: true

      - name: Install graphical runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            xvfb imagemagick \
            libasound2t64 libpulse0 libgl1 libx11-6 libxcursor1 \
            libxinerama1 libxi6 libxrandr2

      - name: Create temporary viewport capture script
        shell: bash
        run: |
          set -euo pipefail
          test -f private-game/project.godot
          mkdir -p private-game/tools private-game/ci-output
          cat > private-game/tools/ci_capture_villa.gd <<'GDSCRIPT'
          extends SceneTree

          func _initialize() -> void:
              call_deferred("_capture")

          func _capture() -> void:
              DisplayServer.window_set_size(Vector2i(1280, 720))
              var packed := load("res://scenes/main.tscn") as PackedScene
              if packed == null:
                  push_error("No se pudo cargar scenes/main.tscn")
                  quit(2)
                  return
              var game := packed.instantiate()
              root.add_child(game)
              for _frame in range(360):
                  await process_frame
              await create_timer(2.0).timeout
              RenderingServer.force_draw()
              await process_frame
              var image := root.get_texture().get_image()
              if image == null or image.is_empty():
                  push_error("El viewport no produjo imagen")
                  quit(3)
                  return
              var output := "res://ci-output/villa-alborada-runtime.png"
              var result := image.save_png(output)
              print("CAPTURE_RESULT=", result, " PATH=", ProjectSettings.globalize_path(output))
              quit(result)
          GDSCRIPT

      - name: Import project
        shell: bash
        run: |
          set +e
          timeout 180 runtime/godot --headless --path private-game --editor --quit \
            > private-game/ci-output/import.log 2>&1
          status=$?
          echo "import_exit=$status" | tee private-game/ci-output/import-status.txt
          tail -n 200 private-game/ci-output/import.log || true
          exit 0

      - name: Render Villa Alborada in Godot
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout 180 runtime/godot \
              --path private-game \
              --display-driver x11 \
              --rendering-method gl_compatibility \
              --resolution 1280x720 \
              --script res://tools/ci_capture_villa.gd \
              -- --modular-terrain \
            > private-game/ci-output/capture.log 2>&1
          cat private-game/ci-output/capture.log
          test -s private-game/ci-output/villa-alborada-runtime.png
          file private-game/ci-output/villa-alborada-runtime.png

      - name: Upload screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: villa-alborada-godot-runtime
          path: private-game/ci-output/
          if-no-files-found: error
          retention-days: 3
