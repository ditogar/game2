name: Package complete private game

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout packaging harness
        uses: actions/checkout@v4

      - name: Find any usable credential and clone private project
        shell: bash
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
          TOKEN_WORKFLOW: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p package/logs
          report=package/logs/credential-scan.txt
          : > "$report"
          remote_https="https://github.com/ditogar/pokemon.git"
          remote_ssh="git@github.com:ditogar/pokemon.git"
          selected_type=""
          selected_name=""
          selected_value=""
          selected_key=""

          try_value() {
            local source="$1"
            local name="$2"
            local value="$3"
            [ -n "$value" ] || return 1
            printf '%s:%s configured\n' "$source" "$name" >> "$report"

            if printf '%s' "$value" | grep -qE 'BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY'; then
              local keyfile
              keyfile="$(mktemp)"
              printf '%s\n' "$value" > "$keyfile"
              chmod 600 "$keyfile"
              if GIT_TERMINAL_PROMPT=0 GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
                  git ls-remote "$remote_ssh" refs/heads/main >/dev/null 2>&1; then
                selected_type="ssh"
                selected_name="$source:$name"
                selected_key="$keyfile"
                return 0
              fi
              rm -f "$keyfile"
              printf '%s:%s no-access\n' "$source" "$name" >> "$report"
              return 1
            fi

            local auth
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$value" | base64 -w0)"
            if GIT_TERMINAL_PROMPT=0 git -c http.extraheader="$auth" \
                ls-remote "$remote_https" refs/heads/main >/dev/null 2>&1; then
              selected_type="https"
              selected_name="$source:$name"
              selected_value="$value"
              return 0
            fi
            printf '%s:%s no-access\n' "$source" "$name" >> "$report"
            return 1
          }

          try_json_context() {
            local source="$1"
            local json="$2"
            [ -n "$json" ] || return 1
            [ "$json" != "{}" ] || return 1
            while IFS= read -r entry64; do
              [ -n "$entry64" ] || continue
              entry="$(printf '%s' "$entry64" | base64 -d)"
              name="$(printf '%s' "$entry" | jq -r '.key')"
              value="$(printf '%s' "$entry" | jq -r '.value // empty')"
              if try_value "$source" "$name" "$value"; then
                return 0
              fi
            done < <(printf '%s' "$json" | jq -r 'to_entries[] | @base64')
            return 1
          }

          try_value "workflow" "GITHUB_TOKEN" "$TOKEN_WORKFLOW" || true
          if [ -z "$selected_type" ]; then
            try_json_context "secret" "$ALL_SECRETS" || true
          fi
          if [ -z "$selected_type" ]; then
            try_json_context "variable" "$ALL_VARS" || true
          fi

          if [ -z "$selected_type" ]; then
            echo "No available secret, variable, workflow token, or SSH key can read ditogar/pokemon" | tee -a "$report" >&2
            exit 21
          fi
          echo "Credential source selected: $selected_name" | tee -a "$report"

          if [ "$selected_type" = "https" ]; then
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$selected_value" | base64 -w0)"
            GIT_TERMINAL_PROMPT=0 git -c http.extraheader="$auth" clone --depth 1 --branch main "$remote_https" pokemon
            if command -v git-lfs >/dev/null 2>&1; then
              git -C pokemon lfs install --local
              git -C pokemon -c http.extraheader="$auth" lfs pull
            fi
          else
            GIT_TERMINAL_PROMPT=0 GIT_SSH_COMMAND="ssh -i $selected_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              git clone --depth 1 --branch main "$remote_ssh" pokemon
            if command -v git-lfs >/dev/null 2>&1; then
              git -C pokemon lfs install --local
              GIT_SSH_COMMAND="ssh -i $selected_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git -C pokemon lfs pull
            fi
          fi

      - name: Verify complete checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f pokemon/project.godot
          test -f pokemon/scenes/main.tscn
          git -C pokemon rev-parse HEAD | tee pokemon-commit.txt
          test "$(git -C pokemon rev-parse HEAD)" = "1efc693e82ff72635ab96d0e8bc5a38cf93095a8"
          find pokemon -type f -not -path 'pokemon/.git/*' | wc -l | tee source-file-count.txt
          du -sh pokemon | tee source-size.txt

      - name: Download Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            --output godot.zip
          echo "4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9  godot.zip" | sha512sum --check --strict
          curl --fail --location --retry 4 --retry-delay 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz \
            --output templates.tpz
          unzip -q godot.zip -d runtime
          mv runtime/Godot_v4.7.1-stable_linux.x86_64 runtime/godot
          chmod +x runtime/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q templates.tpz -d templates-unpacked
          cp -R templates-unpacked/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          runtime/godot --version

      - name: Import and validate project
        shell: bash
        run: |
          set +e
          mkdir -p package/logs
          timeout 300 runtime/godot --headless --path pokemon --editor --quit \
            > package/logs/import.log 2>&1
          status=$?
          echo "$status" > package/logs/import-exit.txt
          tail -n 300 package/logs/import.log || true
          exit 0

      - name: Export Linux and Windows builds
        shell: bash
        run: |
          set +e
          mkdir -p package/linux package/windows package/logs
          timeout 300 runtime/godot --headless --path pokemon \
            --export-release "Linux/X11" "$GITHUB_WORKSPACE/package/linux/bestiario-lumina.x86_64" \
            > package/logs/export-linux.log 2>&1
          echo "$?" > package/logs/export-linux-exit.txt
          timeout 300 runtime/godot --headless --path pokemon \
            --export-release "Windows Desktop" "$GITHUB_WORKSPACE/package/windows/BestiarioLumina.exe" \
            > package/logs/export-windows.log 2>&1
          echo "$?" > package/logs/export-windows-exit.txt
          chmod +x package/linux/bestiario-lumina.x86_64 2>/dev/null || true
          tail -n 200 package/logs/export-linux.log || true
          tail -n 200 package/logs/export-windows.log || true
          exit 0

      - name: Package complete source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/source
          (
            cd pokemon
            zip -q -r "$GITHUB_WORKSPACE/package/source/bestiario-ecos-de-lumina-source.zip" . \
              -x '.git/*' '.godot/*'
          )
          unzip -tq package/source/bestiario-ecos-de-lumina-source.zip
          sha256sum package/source/bestiario-ecos-de-lumina-source.zip \
            > package/source/bestiario-ecos-de-lumina-source.zip.sha256
          find package -maxdepth 3 -type f -print -exec ls -lh {} \;

      - name: Verify required outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s package/source/bestiario-ecos-de-lumina-source.zip
          test -s pokemon-commit.txt
          cp pokemon-commit.txt source-file-count.txt source-size.txt package/

      - name: Upload diagnostics, complete project, and builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bestiario-ecos-de-lumina-complete
          path: package/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
