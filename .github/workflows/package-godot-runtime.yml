name: Export private repository snapshot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4

      - name: Load private repository as authorized action
        uses: ditogar/pokemon@automation/private-snapshot-action

      - name: Verify and package private snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PRIVATE_REPOSITORY_PATH:-}"
          test -f "$PRIVATE_REPOSITORY_PATH/project.godot"
          test -f "$PRIVATE_REPOSITORY_PATH/scenes/main.tscn"
          echo "snapshot_path=$PRIVATE_REPOSITORY_PATH"
          find "$PRIVATE_REPOSITORY_PATH" -type f | wc -l
          du -sh "$PRIVATE_REPOSITORY_PATH"
          mkdir -p export
          (
            cd "$PRIVATE_REPOSITORY_PATH"
            zip -q -r "$GITHUB_WORKSPACE/export/pokemon-main-source.zip" . \
              -x '.git/*' '.github/workflows/*' 'action.yml' '.godot/*'
          )
          sha256sum export/pokemon-main-source.zip | tee export/pokemon-main-source.zip.sha256
          unzip -tq export/pokemon-main-source.zip
          ls -lh export/

      - name: Upload complete private snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-main-source
          path: export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
